# Firewalla Parental Control Dashboard
#
# Installation:
# 1. Install from HACS: "auto-entities" and "mushroom" custom cards
# 2. Go to Settings > Dashboards > Add Dashboard
# 3. Choose "New dashboard from scratch", name it "Firewalla"
# 4. Open the dashboard, click the 3 dots menu > Edit Dashboard
# 5. Click the 3 dots menu again > Raw Configuration Editor
# 6. Paste this entire file and save
#
# IMPORTANT: Replace the placeholder names (User_A, User_B, User_C) and
# entity_id slugs (user_a, user_b, user_c) with your actual Firewalla
# group names. The slugs must match the lowercase names used in your
# Home Assistant entity IDs (e.g., firewalla_group_alice_alice_active).
#
# Each user gets their own column with activity, internet toggle,
# time limits (progress bars), and content block switches.
# New apps/rules auto-discover within each user's column.
#
# To add a new user: duplicate a section and change the name/slug.
# Entity ID pattern: firewalla_group_{slug}_{slug}_{entity}

title: Firewalla Parental Controls
views:
  - title: Users
    path: users
    icon: mdi:shield-account
    type: sections
    max_columns: 3
    sections:
      # ── User_A ─────────────────────────────────────────────
      # Replace "User_A" / "user_a" with your first group name
      - type: grid
        title: User_A
        cards:
          - type: custom:auto-entities
            card:
              type: entities
            filter:
              include:
                - entity_id: "/binary_sensor\\.firewalla_group_user_a_user_a_active/"
                  options:
                    secondary_info: last-changed
                - entity_id: "/switch\\.firewalla_group_user_a_user_a_internet_access/"

          - type: custom:auto-entities
            card:
              type: entities
              title: Time Limits
            filter:
              include:
                - entity_id: "/sensor\\.firewalla_group_user_a_.*_time/"
                  options:
                    type: custom:mushroom-entity-row
                    fill_container: true
            sort:
              method: friendly_name

          - type: custom:auto-entities
            card:
              type: entities
              title: Blocks
            filter:
              include:
                - entity_id: "/switch\\.firewalla_group_user_a_user_a_.*_block/"
              exclude:
                - entity_id: "/.*_doh_block/"
                - entity_id: "switch.firewalla_group_user_a_user_a_block$"
            sort:
              method: friendly_name

      # ── User_B ─────────────────────────────────────────────
      # Replace "User_B" / "user_b" with your second group name
      - type: grid
        title: User_B
        cards:
          - type: custom:auto-entities
            card:
              type: entities
            filter:
              include:
                - entity_id: "/binary_sensor\\.firewalla_group_user_b_user_b_active/"
                  options:
                    secondary_info: last-changed
                - entity_id: "/switch\\.firewalla_group_user_b_user_b_internet_access/"

          - type: custom:auto-entities
            card:
              type: entities
              title: Time Limits
            filter:
              include:
                - entity_id: "/sensor\\.firewalla_group_user_b_.*_time/"
                  options:
                    type: custom:mushroom-entity-row
                    fill_container: true
            sort:
              method: friendly_name

          - type: custom:auto-entities
            card:
              type: entities
              title: Blocks
            filter:
              include:
                - entity_id: "/switch\\.firewalla_group_user_b_user_b_.*_block/"
              exclude:
                - entity_id: "/.*_doh_block/"
                - entity_id: "switch.firewalla_group_user_b_user_b_block$"
            sort:
              method: friendly_name

      # ── User_C ─────────────────────────────────────────────
      # Replace "User_C" / "user_c" with your third group name
      - type: grid
        title: User_C
        cards:
          - type: custom:auto-entities
            card:
              type: entities
            filter:
              include:
                - entity_id: "/binary_sensor\\.firewalla_group_user_c_user_c_active/"
                  options:
                    secondary_info: last-changed
                - entity_id: "/switch\\.firewalla_group_user_c_user_c_internet_access/"

          - type: custom:auto-entities
            card:
              type: entities
              title: Time Limits
            filter:
              include:
                - entity_id: "/sensor\\.firewalla_group_user_c_.*_time/"
                  options:
                    type: custom:mushroom-entity-row
                    fill_container: true
            sort:
              method: friendly_name

          - type: custom:auto-entities
            card:
              type: entities
              title: Blocks
            filter:
              include:
                - entity_id: "/switch\\.firewalla_group_user_c_user_c_.*_block/"
              exclude:
                - entity_id: "/.*_doh_block/"
                - entity_id: "switch.firewalla_group_user_c_user_c_block$"
            sort:
              method: friendly_name
