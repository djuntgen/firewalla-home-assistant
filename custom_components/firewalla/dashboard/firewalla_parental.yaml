# Firewalla Parental Control Dashboard
#
# Prerequisites (install from HACS):
# - auto-entities: auto-discovers entities by pattern
# - entity-progress-card: color-coded progress bars (optional, for time limits)
#
# Installation:
# 1. Go to Settings > Dashboards > Add Dashboard
# 2. Choose "New dashboard from scratch", name it "Firewalla"
# 3. Open the dashboard, click the 3 dots menu > Edit Dashboard
# 4. Click the 3 dots menu again > Raw Configuration Editor
# 5. Paste this entire file and save
#
# This dashboard is FULLY DYNAMIC — it auto-discovers all Firewalla
# users and their entities. No hardcoded names or entity IDs.
# New users, rules, and devices appear automatically.

title: Firewalla Parental Controls
views:
  - title: Users
    path: users
    icon: mdi:shield-account
    type: panel
    badges:
      - type: entity
        entity: button.firewalla_refresh
        tap_action:
          action: toggle
    cards:
      - type: custom:auto-entities
        card:
          type: sections
          max_columns: 4
        card_param: sections
        filter:
          template: |-
            {# Find all user activity sensors to discover users #}
            {% set ns = namespace(sections=[]) %}
            {% for state in states.binary_sensor
               if state.entity_id is match('binary_sensor\.firewalla_group_.*_active$')
               and state.attributes.get('device_class') is none %}
              {% set user = state.name | replace(' Active', '') %}
              {% set slug = state.entity_id | replace('binary_sensor.firewalla_group_', '') | replace('_active', '') %}
              {% set section = {
                "type": "grid",
                "title": user,
                "cards": [
                  {
                    "type": "custom:auto-entities",
                    "card": {"type": "entities"},
                    "filter": {
                      "include": [
                        {"entity_id": "binary_sensor.firewalla_group_" ~ slug ~ "_active",
                         "options": {"secondary_info": "last-changed"}},
                        {"entity_id": "switch.*" ~ slug ~ "*internet*"}
                      ]
                    }
                  },
                  {
                    "type": "custom:auto-entities",
                    "card": {"type": "entities", "title": "Time Limits"},
                    "filter": {
                      "include": [
                        {"entity_id": "sensor.firewalla_group_" ~ slug ~ "_*_time"}
                      ]
                    },
                    "sort": {"method": "friendly_name"},
                    "show_empty": false
                  },
                  {
                    "type": "custom:auto-entities",
                    "card": {"type": "entities", "title": "Blocks"},
                    "filter": {
                      "include": [
                        {"entity_id": "switch.firewalla_group_" ~ slug ~ "_*_block"},
                        {"entity_id": "switch.*_block_*",
                         "options": {"secondary_info": "last-changed"},
                         "attributes": {"group_id": state.attributes.get('group_id', '')}}
                      ],
                      "exclude": [
                        {"entity_id": "*_doh_block*"},
                        {"state": "unavailable"}
                      ]
                    },
                    "sort": {"method": "friendly_name"},
                    "show_empty": false
                  },
                  {
                    "type": "custom:auto-entities",
                    "card": {"type": "entities", "title": "Devices"},
                    "filter": {
                      "include": [
                        {"entity_id": "binary_sensor.firewalla_group_" ~ slug ~ "_*",
                         "not": {"entity_id": "*_active$"},
                         "options": {"secondary_info": "last-changed"}}
                      ]
                    },
                    "sort": {"method": "friendly_name"},
                    "show_empty": false
                  }
                ]
              } %}
              {% set ns.sections = ns.sections + [section] %}
            {% endfor %}
            {{ ns.sections }}
