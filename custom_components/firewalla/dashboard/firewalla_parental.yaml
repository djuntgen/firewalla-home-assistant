# Firewalla Parental Control Dashboard
#
# Installation:
# 1. Install from HACS: "auto-entities" and "mushroom" custom cards
# 2. Go to Settings > Dashboards > Add Dashboard
# 3. Choose "New dashboard from scratch", name it "Firewalla"
# 4. Open the dashboard, click the 3 dots menu > Edit Dashboard
# 5. Click the 3 dots menu again > Raw Configuration Editor
# 6. Paste this entire file and save
#
# Each kid gets their own column with activity, internet toggle,
# time limits (progress bars), and content block switches.
# New apps/rules auto-discover within each kid's column.
#
# To add a new kid: duplicate a section and change the name/slug.
# Entity ID pattern: firewalla_group_{slug}_{slug}_{entity}

title: Firewalla Parental Controls
views:
  - title: Kids
    path: kids
    icon: mdi:shield-account
    type: sections
    max_columns: 3
    sections:
      # ── Matt ──────────────────────────────────────────────
      - type: grid
        title: Matt
        cards:
          - type: custom:auto-entities
            card:
              type: entities
            filter:
              include:
                - entity_id: "/binary_sensor\\.firewalla_group_matt_matt_active/"
                  options:
                    secondary_info: last-changed
                - entity_id: "/switch\\.firewalla_group_matt_matt_internet_access/"

          - type: custom:auto-entities
            card:
              type: entities
              title: Time Limits
            filter:
              include:
                - entity_id: "/sensor\\.firewalla_group_matt_.*_time/"
                  options:
                    type: custom:mushroom-entity-row
                    fill_container: true
            sort:
              method: friendly_name

          - type: custom:auto-entities
            card:
              type: entities
              title: Blocks
            filter:
              include:
                - entity_id: "/switch\\.firewalla_group_matt_matt_.*_block/"
              exclude:
                - entity_id: "/.*_doh_block/"
                - entity_id: "switch.firewalla_group_matt_matt_block$"
            sort:
              method: friendly_name

      # ── Harvey ────────────────────────────────────────────
